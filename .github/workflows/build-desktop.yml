name: Build Desktop App

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: White-Mart-Linux
          - os: windows-latest
            artifact_name: White-Mart-Windows
          - os: macos-latest
            artifact_name: White-Mart-macOS

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite, bcmath, intl, gd, exif, iconv, xmlwriter, xml, fileinfo, simplexml
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # CRITICAL: Environment must be fully ready BEFORE composer install.
      # Composer's post-autoload-dump scripts run `php artisan` commands
      # which boot the full Laravel app and need .env, APP_KEY, database, and storage dirs.
      - name: Prepare Environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache
          php -r "file_put_contents('.env', str_replace('APP_KEY=', 'APP_KEY=base64:' . base64_encode(random_bytes(32)), file_get_contents('.env')));"

      # Use --no-scripts to skip composer's post-autoload-dump hooks
      # (package:discover, filament:upgrade) which can crash in CI.
      # We run package:discover manually in the next step instead.
      - name: Install Composer Dependencies
        run: composer install --no-scripts --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader --ignore-platform-reqs

      # Manually discover packages (required for NativePHP service provider).
      # This is safer than letting composer run ALL scripts including filament:upgrade.
      - name: Discover Packages
        run: php artisan package:discover --ansi

      - name: Install NPM Dependencies
        run: npm ci

      - name: Verify Framework Boots
        run: php artisan --version

      - name: Build Desktop Application
        run: php artisan native:build
        env:
          NATIVEPHP_APP_VERSION: ${{ github.ref_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            nativephp/electron/dist/*.exe
            nativephp/electron/dist/*.msi
            nativephp/electron/dist/*.AppImage
            nativephp/electron/dist/*.deb
            nativephp/electron/dist/*.dmg
            nativephp/electron/dist/*.zip
            nativephp/electron/dist/*.yml
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/White-Mart-Linux/*
            dist/White-Mart-Windows/*
            dist/White-Mart-macOS/*
          draft: true
          generate_release_notes: true
