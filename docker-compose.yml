name: white-mart

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.5"
        NODE_VERSION: "22"
        FLUX_USERNAME: "${FLUX_USERNAME:-}"
        FLUX_LICENSE_KEY: "${FLUX_LICENSE_KEY:-}"
    container_name: white-mart-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: "${DOCKER_APP_NAME:-White-Mart}"
      APP_ENV: "${DOCKER_APP_ENV:-production}"
      APP_KEY: "${DOCKER_APP_KEY:-}"
      APP_DEBUG: "${DOCKER_APP_DEBUG:-false}"
      APP_URL: "${DOCKER_APP_URL:-http://localhost}"
      LOG_CHANNEL: "${DOCKER_LOG_CHANNEL:-stack}"
      LOG_STACK: "${DOCKER_LOG_STACK:-single}"
      LOG_LEVEL: "${DOCKER_LOG_LEVEL:-warning}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DOCKER_DB_DATABASE:-white_mart}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-white_mart}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-white_mart_change_me}"
      CACHE_STORE: "${DOCKER_CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${DOCKER_QUEUE_CONNECTION:-database}"
      SESSION_DRIVER: "${DOCKER_SESSION_DRIVER:-database}"
      SESSION_ENCRYPT: "${DOCKER_SESSION_ENCRYPT:-true}"
      FILESYSTEM_DISK: "${DOCKER_FILESYSTEM_DISK:-local}"
      MAIL_MAILER: "${DOCKER_MAIL_MAILER:-log}"
      BARCODE_LOOKUP_PROVIDERS: "${DOCKER_BARCODE_LOOKUP_PROVIDERS:-}"
      PHP_FPM_PM_MAX_CHILDREN: "${DOCKER_PHP_FPM_PM_MAX_CHILDREN:-12}"
      PHP_FPM_PM_START_SERVERS: "${DOCKER_PHP_FPM_PM_START_SERVERS:-3}"
      PHP_FPM_PM_MIN_SPARE_SERVERS: "${DOCKER_PHP_FPM_PM_MIN_SPARE_SERVERS:-2}"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "${DOCKER_PHP_FPM_PM_MAX_SPARE_SERVERS:-4}"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - white_mart
    healthcheck:
      test: ["CMD-SHELL", "white-mart-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
      args:
        PHP_VERSION: "8.5"
        NODE_VERSION: "22"
        FLUX_USERNAME: "${FLUX_USERNAME:-}"
        FLUX_LICENSE_KEY: "${FLUX_LICENSE_KEY:-}"
    container_name: white-mart-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${DOCKER_APP_PORT:-80}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    networks:
      - white_mart
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: white-mart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DOCKER_DB_DATABASE:-white_mart}"
      MYSQL_USER: "${DOCKER_DB_USERNAME:-white_mart}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-white_mart_change_me}"
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-white_mart_root_change_me}"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - white_mart
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: white-mart-phpmyadmin
    profiles:
      - tools
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${DOCKER_PHPMYADMIN_PORT:-8081}:80"
    networks:
      - white_mart

networks:
  white_mart:
    driver: bridge

volumes:
  mysql_data:
  app_storage:
